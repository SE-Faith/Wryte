openapi: 3.0.3
info:
  title: Wryte API Specification
  version: 1.0.0
  description: |
    API documentation for the Wryte blogging platform.

    Authentication uses a Bearer JWT token in the Authorization header.
    For browser-based state-changing requests, the frontend fetches a CSRF token from /api/csrf-token and includes it as x-csrf-token header.
servers:
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: System & Security
    description: Health checks, system status, and CSRF token endpoints.
  - name: Authentication
    description: Registration, login, password changes, and OTP email verification.
  - name: Posts & Stories
    description: Article creation, feed querying, updates, and deletion.
  - name: Categories
    description: Category taxonomy creation, listing, updates, and deletion.
  - name: Tags
    description: Tag creation, listing, updates, and deletion.
  - name: Search
    description: Full-text search for articles and public user profiles.
  - name: User Profiles
    description: User profile updates, public profile metrics, and follow/unfollow operations.
  - name: History & Interactions
    description: Post likes, view logging, view history, and bookmarks.
  - name: Admin Console
    description: Administrative controls for user roles, suspension, banning, and deletion.
  - name: Newsletter
    description: Newsletter subscriptions and subscriber management.

paths:
  /api/health:
    get:
      tags:
        - System & Security
      summary: Health check
      description: Check database connectivity and API status.
      responses:
        '200':
          description: Server healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time

  /api/csrf-token:
    get:
      tags:
        - System & Security
      summary: Get a CSRF token
      description: Generate and retrieve a CSRF token for state-changing requests.
      responses:
        '200':
          description: CSRF token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully and OTP code generated.
        '400':
          description: Invalid data or user already exists.

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication.
        '401':
          description: Invalid email or password.

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated successfully.

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset OTP code sent.

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password using verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successfully.

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Email verified successfully.

  /post/all:
    get:
      tags:
        - Posts & Stories
      summary: Get blog posts feed with full-text search and filtering
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
            description: Full-text search keyword
        - in: query
          name: category
          schema:
            type: string
            description: Category ID filter
        - in: query
          name: author
          schema:
            type: string
            description: Author User ID filter
      responses:
        '200':
          description: Paginated posts list sorted by relevance or recency.

  /post/create:
    post:
      tags:
        - Posts & Stories
      summary: Create a new blog post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post created successfully.

  /post/{postId}:
    get:
      tags:
        - Posts & Stories
      summary: Get single post by ID and increment post views
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details with populated references.
    put:
      tags:
        - Posts & Stories
      summary: Update a post (Author or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Post updated successfully.
    delete:
      tags:
        - Posts & Stories
      summary: Delete a post (Author or Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted successfully.

  /category/all:
    get:
      tags:
        - Categories
      summary: List all categories
      responses:
        '200':
          description: Category list retrieved.

  /category/create:
    post:
      tags:
        - Categories
      summary: Create a new category (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created successfully.

  /category/{categoryId}:
    put:
      tags:
        - Categories
      summary: Update a category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated.
    delete:
      tags:
        - Categories
      summary: Delete a category (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted.

  /tag:
    get:
      tags:
        - Tags
      summary: List all tags
      responses:
        '200':
          description: List of tags.
    post:
      tags:
        - Tags
      summary: Create a tag (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Tag created.

  /tag/{tagId}:
    put:
      tags:
        - Tags
      summary: Update a tag (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Tag updated.
    delete:
      tags:
        - Tags
      summary: Delete a tag (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tagId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag deleted.

  /search/people:
    get:
      tags:
        - Search
      summary: Full-text search for users/people
      description: Search public user profiles by name, displayName, or bio. Email fields are excluded for privacy.
      parameters:
        - in: query
          name: search
          schema:
            type: string
            description: Search term
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: People search results sorted by relevance.

  /profile/get:
    get:
      tags:
        - User Profiles
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile details.

  /profile/get/{userId}:
    get:
      tags:
        - User Profiles
      summary: Get public user profile and increment profileViews
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public user profile with follower/following details.

  /profile/update:
    put:
      tags:
        - User Profiles
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                avatar:
                  type: string
                bio:
                  type: string
                socialLinks:
                  type: object
      responses:
        '200':
          description: Profile updated.

  /profile/follow/{userId}:
    post:
      tags:
        - User Profiles
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Followed user.

  /profile/unfollow/{userId}:
    post:
      tags:
        - User Profiles
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unfollowed user.

  /profile/view/{postId}:
    post:
      tags:
        - History & Interactions
      summary: Log a post view in user history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post view logged.

  /profile/history/views:
    get:
      tags:
        - History & Interactions
      summary: Get viewed posts history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of viewed posts.

  /profile/history/likes:
    get:
      tags:
        - History & Interactions
      summary: Get liked posts history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of liked posts.

  /like/like/{postId}:
    post:
      tags:
        - History & Interactions
      summary: Like a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post liked.

  /like/unlike/{postId}:
    post:
      tags:
        - History & Interactions
      summary: Unlike a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post unliked.

  /bookmark/post/{postId}:
    post:
      tags:
        - History & Interactions
      summary: Bookmark a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post bookmarked.
    delete:
      tags:
        - History & Interactions
      summary: Remove a bookmark
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bookmark removed.

  /admin/all:
    get:
      tags:
        - Admin Console
      summary: Get all registered users (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user accounts.

  /admin/user/{userId}:
    get:
      tags:
        - Admin Console
      summary: Get user details by ID (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User record details.
    delete:
      tags:
        - Admin Console
      summary: Delete user account (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User account deleted.

  /admin/role/{userId}:
    put:
      tags:
        - Admin Console
      summary: Update user role (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, admin]
      responses:
        '200':
          description: User role updated.

  /admin/suspend/{userId}:
    put:
      tags:
        - Admin Console
      summary: Suspend user account (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User suspended.

  /admin/unsuspend/{userId}:
    put:
      tags:
        - Admin Console
      summary: Unsuspend user account (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unsuspended.

  /admin/ban/{userId}:
    put:
      tags:
        - Admin Console
      summary: Ban user account (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User banned.

  /admin/unban/{userId}:
    put:
      tags:
        - Admin Console
      summary: Unban user account (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unbanned.

  /newsletter/admin/subscribers:
    get:
      tags:
        - Newsletter
      summary: List all newsletter subscribers (Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of subscribers.

  /newsletter/admin/subscribers/{subscriberId}:
    delete:
      tags:
        - Newsletter
      summary: Remove subscriber (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subscriberId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscriber removed.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    PostInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        subTitle:
          type: string
        content:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        image:
          type: string
        status:
          type: string
          enum: [draft, published, scheduled]

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"
