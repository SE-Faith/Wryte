openapi: 3.0.3
info:
  title: Wryte API
  version: 1.0.0
  description: |
    API for the Wryte blogging platform.

    Authentication uses a bearer token in the Authorization header.
    For browser-based state-changing requests, the frontend also fetches a CSRF token from /api/csrf-token and sends it as x-csrf-token.
servers:
  - url: http://localhost:4000
    description: Local development server
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time

  /api/csrf-token:
    get:
      summary: Get a CSRF token
      responses:
        '200':
          description: CSRF token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Invalid data or duplicate email

  /auth/login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    type: object
        '401':
          description: Invalid credentials

  /auth/change-password:
    post:
      summary: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated

  /auth/forgot-password:
    post:
      summary: Request password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/reset-password:
    post:
      summary: Reset password using a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                otp:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset

  /auth/verify-email:
    post:
      summary: Verify user email with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Email verified

  /post/all:
    get:
      summary: Get posts feed
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 6
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object

  /post/create:
    post:
      summary: Create a new post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post created

  /post/{postId}:
    get:
      summary: Get a single post
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post found
    put:
      summary: Update a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Post updated
    delete:
      summary: Delete a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted

  /category/all:
    get:
      summary: List categories
      responses:
        '200':
          description: Category list

  /category/create:
    post:
      summary: Create category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Category created

  /tag:
    get:
      summary: List all tags
      responses:
        '200':
          description: Tag list

  /profile/get:
    get:
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile

  /profile/get/{userId}:
    get:
      summary: Get a public user profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile data

  /profile/update:
    put:
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated

  /profile/follow/{userId}:
    post:
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Follow successful

  /profile/unfollow/{userId}:
    post:
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unfollow successful

  /profile/followers:
    get:
      summary: Get current user's followers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of followers

  /profile/following:
    get:
      summary: Get current user's following list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Following list

  /profile/view/{postId}:
    post:
      summary: Log a post view
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: View logged

  /profile/history/views:
    get:
      summary: Get viewed posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: View history

  /profile/history/likes:
    get:
      summary: Get liked posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liked history

  /like/like/{postId}:
    post:
      summary: Like a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post liked

  /like/unlike/{postId}:
    post:
      summary: Unlike a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post unliked

  /bookmark/post/{postId}:
    post:
      summary: Bookmark a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post bookmarked
    delete:
      summary: Remove a bookmark
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bookmark removed

  /notification:
    get:
      summary: Get notifications for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications list

  /admin/all:
    get:
      summary: List all users as admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list

  /admin/user/{userId}:
    get:
      summary: Get a single user record as admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User data

  /admin/suspend/{userId}:
    put:
      summary: Suspend a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User suspended

  /admin/ban/{userId}:
    put:
      summary: Ban a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User banned

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    PostInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        image:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: object

              type: object
              properties:
                title:
                  type: string
                  example: "Unlocking Creativity: An Advanced Guide"
                content:
                  type: string
                  example: "This updated version goes deeper into creative exercises..."
                tags:
                  type: array
                  items:
                    type: string
                  example: ["creativity", "advanced"]
      responses:
        '200':
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden to edit others' posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post
      description: Permanently remove a blog post. Only the original author can delete.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The post ID
          schema:
            type: string
      responses:
        '200':
          description: Post deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Post deleted successfully"
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden to delete others' posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Post:
      type: object
      required:
        - id
        - title
        - content
        - author
      properties:
        id:
          type: string
          example: "60b9f5f08819c900155b9abc"
        title:
          type: string
          example: "Unlocking Creativity: A Beginner's Guide"
        content:
          type: string
          example: "In this post we explore the psychological barriers to creativity..."
        author:
          type: object
          properties:
            id:
              type: string
              example: "60b9f5f08819c900155b9abc"
            name:
              type: string
              example: "Jane Doe"
        tags:
          type: array
          items:
            type: string
          example: ["creativity", "writing", "guide"]
        createdAt:
          type: string
          format: date-time
          example: "2026-05-24T15:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-24T15:00:00.000Z"
    Error:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An unexpected error occurred"
        errors:
          type: array
          items:
            type: string
          example: ["Field 'email' is invalid"]
